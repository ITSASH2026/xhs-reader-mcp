name: xhs-reader-mcp
services:
  reader:
    build:
      context: .
      args:
        XHS_COMMIT: 2ab2620b0dd35b04530e70f1e9c7ab3f78c5d6c5
    image: xhs-reader-mcp:local
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    restart: unless-stopped
    init: true
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-5556}:5556"
    volumes:
      - ./private/auth_secret.key:/app/Volume/auth_secret.key:ro
      - ./private/settings.json:/app/Volume/settings.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/Volume:size=256m,uid=${MCP_UID:-1000},gid=${MCP_GID:-1000},mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1280m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',5556),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
